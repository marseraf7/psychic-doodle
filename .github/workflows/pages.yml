# Tự động đăng game lên GitHub Pages mỗi khi có thay đổi trong thư mục caro/.
name: Deploy Caro to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ['caro/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test luật chơi
        run: node caro/tests/rules.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: caro
      - id: deployment
        uses: actions/deploy-pages@v4
