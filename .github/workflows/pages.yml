# Tự động đăng game lên GitHub Pages mỗi khi có thay đổi trong thư mục caro/.
name: Deploy Caro to GitHub Pages

on:
  push:
    paths: ['caro/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Chỉ đăng từ nhánh mặc định của repo (dù tên nhánh là gì), hoặc khi bấm chạy tay.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    # Nhóm chạy đặt ở job (không ở workflow): lần push lên nhánh khác bị bỏ qua (if ở trên) thì không vào nhóm, nên không
    # huỷ được lần đăng của nhánh mặc định. Trước đây đặt ở workflow + cancel-in-progress: reset nhánh làm việc ngay sau
    # merge đã huỷ lần đăng của #119 và #121. Không huỷ lần đăng đang chạy – lần sau xếp hàng chờ.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test luật chơi
        run: node caro/tests/rules.test.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: caro
      - id: deployment
        uses: actions/deploy-pages@v5
