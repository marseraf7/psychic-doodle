# Chạy kiểm thử luật chơi và máy chủ online cho mỗi lần đẩy code / pull request.
name: Test Caro

on:
  push:
    paths: ['caro/**', 'server/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['caro/**', 'server/**', '.github/workflows/test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node caro/tests/rules.test.js
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
