# Chạy kiểm thử luật chơi và máy chủ online cho mỗi lần đẩy code / pull request.
name: Test Caro

on:
  push:
    paths: ['caro/**', 'server/**', '.github/workflows/test.yml']
  # PR nào cũng chạy (kể cả PR chỉ sửa tài liệu): nhánh chính bắt buộc các check này xanh mới cho merge
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node caro/tests/rules.test.js
      - run: npm ci
        working-directory: server
      # Chạy toàn bộ kiểm thử máy chủ + luật chơi kèm đo độ phủ; dưới ngưỡng (dòng 90%, nhánh 80%, hàm 85%) thì báo lỗi
      - name: Kiểm thử + độ phủ
        run: npm run coverage
        working-directory: server

  # BOAT chạy Rapfi (WebAssembly) trong trình duyệt thật: 3 luật, luật Việt Nam, bộ nhớ đệm mạng, phân tích bằng Rapfi,
  # mạng hỏng, trang giấy phép (caro/tests/e2e/boat-rapfi.e2e.js); Lịch sử đấu trên máy + Thiết bị (localhist.e2e.js). Mạng NNUE (CC0, ~40 MB) tải 1 lần rồi giữ trong cache.
  rapfi-e2e:
    # Ghim 24.04: ubuntu-latest đã lên 26.04, Playwright 1.56.1 không cài được trình duyệt trên bản này
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit] # webkit ≈ Safari
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - name: Cài Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Bộ nhớ đệm mạng Rapfi
        uses: actions/cache@v4
        with:
          path: ~/rapfi-nets
          key: rapfi-nets-e32ad77
      - name: Tải mạng Rapfi (lần đầu)
        run: |
          mkdir -p ~/rapfi-nets && cd ~/rapfi-nets
          for f in mix9svqfreestyle_bsmix mix9svqstandard_bs15 mix9svqrenju_bs15_black mix9svqrenju_bs15_white; do
            [ -s $f.bin.lz4 ] || curl -fsSLO https://raw.githubusercontent.com/marseraf7/rapfi-networks/e32ad77a5364363b3e3a02b3f9e8610ade19ea98/mix9svq/$f.bin.lz4 \
              || curl -fsSLO https://raw.githubusercontent.com/dhbloo/rapfi-networks/e32ad77a5364363b3e3a02b3f9e8610ade19ea98/mix9svq/$f.bin.lz4
          done
          sha256sum *.lz4
      # retry-crash.js: WebKit Linux trên CI thỉnh thoảng tự sập – chỉ khi đỏ vì sập mới chạy lại 1 lần (FAIL thật vẫn đỏ ngay)
      # Chromium: bản đầy đủ (E2E_CHANNEL) – headless shell chưa hỗ trợ Document-Isolation-Policy nên không thử được Rapfi
      # đa luồng; Firefox / WebKit thử bản 1 luồng
      - name: Kiểm thử trình duyệt BOAT – Rapfi
        run: E2E_BROWSER=${{ matrix.browser }} E2E_CHANNEL=${{ matrix.browser == 'chromium' && 'chromium' || '' }} RAPFI_NETS=$HOME/rapfi-nets E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/boat-rapfi.e2e.js
      # Lịch sử đấu trên máy này (hỏi lưu khi khách / offline, chọn nhiều ván để xoá, Cài đặt) + Thiết bị (localhist.e2e.js)
      - name: Kiểm thử trình duyệt Lịch sử đấu trên máy + Thiết bị
        timeout-minutes: 25
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/localhist.e2e.js
      # Giả lập điện thoại cảm ứng (isMobile + hasTouch, UA Android)
      - name: Kiểm thử trình duyệt Lịch sử đấu trên máy – giả lập điện thoại
        timeout-minutes: 25
        if: success() || failure()
        run: E2E_MOBILE=1 E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots-mobile node caro/tests/e2e/retry-crash.js caro/tests/e2e/localhist.e2e.js
      # Bố cục 8 kích thước thiết bị (điện thoại → desktop), xoay màn hình, 4 ngôn ngữ ở 360 px (devices.e2e.js)
      - name: Kiểm thử trình duyệt Bố cục đa thiết bị
        timeout-minutes: 15
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/devices.e2e.js
      # Thanh trên: tìm kỳ thủ, Đăng nhập / Đăng ký, Cài đặt nhanh + ping, số kỳ thủ / ván, ảnh nền, ảnh đại diện (topbar.e2e.js)
      - name: Kiểm thử trình duyệt Thanh trên + Cài đặt nhanh + ảnh đại diện
        timeout-minutes: 10
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/topbar.e2e.js
      # Thanh trên với tên dài ở mọi bề rộng, Kết bạn ↔ Huỷ kết bạn, bong bóng chat + trạng thái bạn bè (friends-chat.e2e.js)
      - name: Kiểm thử trình duyệt Bạn bè + bong bóng chat
        timeout-minutes: 10
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/friends-chat.e2e.js
      # Xếp cặp nhanh: ghép lần 2 từ Trang chủ tự vào bàn cờ, thẻ Quay lại đúng mã phòng, lệnh cấm tìm trận hiện rõ (quickmatch.e2e.js)
      - name: Kiểm thử trình duyệt Xếp cặp nhanh
        timeout-minutes: 8
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/quickmatch.e2e.js
      # Sửa lỗi buổi kiểm thử 25/10 (#141, #144): hộp xác nhận trong app, hàng chờ tự tìm lại, tái đấu, thẻ Quay lại ván,
      # +15 giây gia hạn nước đầu, mục Xem, giao diện online; trang Cài đặt nâng cao khi tạo giải (tour-adv), giải offline (tour-offline), khu quản trị giải (tour-manage), đồng ban tổ chức (tour-staff), xem nhánh đấu + trang nhúng (tour-view)
      # (chỉ Chromium: luồng máy chủ / giao diện, không phụ thuộc trình duyệt)
      - name: Kiểm thử trình duyệt các bản sửa buổi kiểm thử 25/10
        timeout-minutes: 15
        if: matrix.browser == 'chromium' && (success() || failure())
        run: |
          for t in confirm-dlg queue-resume rematch resume-card moretime watch-fix144 fix141 premove analysis-plus rotate analysis-layout inbox tour-adv tour-offline tour-manage tour-staff tour-view; do
            E2E_BROWSER=chromium E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/$t.e2e.js || exit 1
          done
      # Mở / tải lại khi mạng chậm: Trang chủ hiện sẵn từ HTML, service worker lấy file từ bộ nhớ đệm trước (boot.e2e.js)
      - name: Kiểm thử trình duyệt mở trang khi mạng chậm
        timeout-minutes: 8
        if: success() || failure()
        run: E2E_BROWSER=${{ matrix.browser }} E2E_OUT=$RUNNER_TEMP/shots node caro/tests/e2e/retry-crash.js caro/tests/e2e/boot.e2e.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boat-rapfi-e2e-${{ matrix.browser }}
          path: ${{ runner.temp }}/shots
