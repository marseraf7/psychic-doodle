# Chạy kiểm thử luật chơi và máy chủ online cho mỗi lần đẩy code / pull request.
name: Test Caro

on:
  push:
    paths: ['caro/**', 'server/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['caro/**', 'server/**', '.github/workflows/test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node caro/tests/rules.test.js
      - run: npm ci
        working-directory: server
      # Chạy toàn bộ kiểm thử máy chủ + luật chơi kèm đo độ phủ; dưới ngưỡng (dòng 90%, nhánh 80%, hàm 85%) thì báo lỗi
      - name: Kiểm thử + độ phủ
        run: npm run coverage
        working-directory: server
