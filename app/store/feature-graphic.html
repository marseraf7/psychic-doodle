<!DOCTYPE html>
<!-- Ảnh feature graphic 1024×500 cho cửa hàng — chụp bởi app/store/screenshots.js. Không sửa kích thước khung. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caro x Gomoku — feature graphic</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(120deg, #14532d 0%, #166534 55%, #15803d 100%);
    color: #fff; display: flex; align-items: center; gap: 48px; padding: 0 72px;
    position: relative;
  }
  /* Lưới bàn cờ mờ phía nền */
  body::before {
    content: ""; position: absolute; inset: 0; opacity: .14;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, #fff 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, #fff 39px 40px);
  }
  .logo { width: 240px; height: 240px; border-radius: 48px; background: #fff; padding: 22px; z-index: 1; box-shadow: 0 18px 44px rgba(0,0,0,.35); }
  .txt { z-index: 1; }
  h1 { font-size: 84px; line-height: 1.05; letter-spacing: .5px; }
  p { font-size: 34px; margin-top: 18px; color: #dcfce7; }
  .stones { margin-top: 26px; font-size: 30px; letter-spacing: 10px; }
</style>
</head>
<body>
  <img class="logo" src="../../caro/icon.svg" alt="">
  <div class="txt">
    <h1>Caro x Gomoku</h1>
    <p>Play online · Beat the bots · Analyse &amp; learn</p>
    <div class="stones">✕ ○ ✕ ○ ✕</div>
  </div>
</body>
</html>
