<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191e" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Cờ Caro online – bàn cờ vô hạn, luật chặn 2 đầu, chơi 2 người hoặc với máy.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cờ Caro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <!-- Áp dụng giao diện Sáng/Tối trước khi vẽ để không bị nháy màu -->
  <script src="theme.js"></script>
</head>
<body>
  <!-- Bộ biểu tượng (nét 2px, cùng một kiểu) – dùng: <svg class="ico"><use href="#i-..."/></svg> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-center" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.13 10.03 L21.47 10.45 L21.47 13.55 L19.13 13.97 L18.44 15.65 L19.79 17.60 L17.60 19.79 L15.65 18.44 L13.97 19.13 L13.55 21.47 L10.45 21.47 L10.03 19.13 L8.35 18.44 L6.40 19.79 L4.21 17.60 L5.56 15.65 L4.87 13.97 L2.53 13.55 L2.53 10.45 L4.87 10.03 L5.56 8.35 L4.21 6.40 L6.40 4.21 L8.35 5.56 L10.03 4.87 L10.45 2.53 L13.55 2.53 L13.97 4.87 L15.65 5.56 L17.60 4.21 L19.79 6.40 L18.44 8.35Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="i-draw" viewBox="0 0 24 24"><text x="12" y="19" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor" stroke="none">½</text></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 17l-5-5 5-5M4 12h11"/></symbol>
    <symbol id="i-first" viewBox="0 0 24 24"><path d="M18 6l-7 6 7 6M6 6v12"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <!-- Giải đấu, câu lạc bộ -->
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 16v5M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4.5a2.5 2.5 0 0 0 2.6 4.5M17 6h2.5a2.5 2.5 0 0 1-2.6 4.5"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 6.5 13 3h3v3l-3.5 3.5M11 13l-4 4M5 14l4 4M3 19l2 2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7.5 2.5 10.5 9M16.5 2.5 13.5 9" /><circle cx="12" cy="15" r="6" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="3.2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 16v6M9 3h6l-1 6 3 3.5H7L10 9z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 22c4.1 0 7-2.9 7-7 0-3.2-2-5.6-4-7.6-.2 2.1-1.2 3.6-2.6 4.2C12.6 8.3 11 5 8.4 2.5 8.6 6.4 5 8.8 5 14.6 5 18.9 7.9 22 12 22z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  </svg>

  <canvas id="board" data-i18n-aria="board_aria"></canvas>

  <header class="bar top">
    <div class="turn" id="turn" aria-live="polite"></div>
    <div class="clock" id="clock" hidden><svg class="ico clock-ico" aria-hidden="true"><use href="#i-clock"/></svg><span id="clock-n"></span></div>
    <div class="score" id="score" data-i18n-title="score_title"></div>
  </header>

  <nav class="bar bottom local-only">
    <button id="btn-new" type="button"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="btn_new"></span></button>
    <button id="btn-undo" type="button"><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg><span data-i18n="btn_undo"></span></button>
    <button id="btn-center" type="button"><svg class="ico" aria-hidden="true"><use href="#i-center"/></svg><span data-i18n="btn_center"></span></button>
    <button id="btn-online" type="button"><svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg><span data-i18n="btn_online"></span><i class="badge" id="online-badge" hidden></i></button>
    <button id="btn-settings" type="button"><svg class="ico" aria-hidden="true"><use href="#i-gear"/></svg><span data-i18n="btn_settings"></span></button>
  </nav>

  <nav class="bar bottom online-only">
    <button id="btn-room" type="button"><svg class="ico" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="btn_room"></span></button>
    <button id="btn-center2" type="button"><svg class="ico" aria-hidden="true"><use href="#i-center"/></svg><span data-i18n="btn_center"></span></button>
    <button id="btn-draw" type="button"><svg class="ico" aria-hidden="true"><use href="#i-draw"/></svg><span id="btn-draw-label" data-i18n="btn_draw"></span></button>
    <button id="btn-resign" type="button"><svg class="ico" aria-hidden="true"><use href="#i-flag"/></svg><span data-i18n="btn_resign"></span></button>
    <button id="btn-leave" type="button"><svg class="ico" aria-hidden="true"><use href="#i-exit"/></svg><span data-i18n="btn_leave"></span></button>
  </nav>

  <!-- Xem lại ván đã lưu -->
  <nav class="bar bottom replay-only">
    <button id="rp-first" type="button"><svg class="ico" aria-hidden="true"><use href="#i-first"/></svg><span data-i18n="rp_first"></span></button>
    <button id="rp-prev" type="button"><svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg><span data-i18n="rp_prev"></span></button>
    <button id="rp-play" type="button"><svg class="ico" id="rp-play-ico" aria-hidden="true"><use href="#i-play"/></svg><span id="rp-play-label" data-i18n="rp_play"></span></button>
    <button id="rp-next" type="button"><svg class="ico" aria-hidden="true"><use href="#i-next"/></svg><span data-i18n="rp_next"></span></button>
    <button id="rp-share" type="button"><svg class="ico" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="share_game"></span></button>
    <button id="rp-close" type="button"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg><span data-i18n="rp_close"></span></button>
  </nav>

  <!-- Chat nhanh trong phòng -->
  <button type="button" class="fab online-only" id="quick-btn" data-i18n-aria="quick_chat" data-i18n-title="quick_chat"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg></button>
  <div class="quick-menu" id="quick-menu" hidden></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="banner" id="banner" hidden>
    <div class="banner-card">
      <div class="banner-title" id="banner-title"></div>
      <div class="banner-sub" id="banner-sub"></div>
      <div class="banner-actions">
        <button id="banner-view" type="button" class="ghost" data-i18n="banner_view"></button>
        <button id="banner-leave" type="button" class="ghost online-only" data-i18n="btn_leave"></button>
        <button id="banner-new" type="button" class="primary local-only" data-i18n="btn_new"></button>
        <button id="banner-share" type="button" class="ghost online-only" data-i18n="share_game" hidden></button>
        <button id="banner-quick" type="button" class="ghost online-only" data-i18n="qm_again" hidden></button>
        <button id="banner-tour" type="button" class="primary online-only" data-i18n="tour_view" hidden></button>
        <button id="banner-rematch" type="button" class="primary online-only" data-i18n="rematch"></button>
      </div>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2 data-i18n="settings" tabindex="-1" autofocus></h2>

      <fieldset>
        <legend data-i18n="mode"></legend>
        <div class="seg">
          <label><input type="radio" name="mode" value="ai"> <span data-i18n="mode_ai"></span></label>
          <label><input type="radio" name="mode" value="pvp"> <span data-i18n="mode_pvp"></span></label>
        </div>
      </fieldset>

      <fieldset class="ai-only">
        <legend data-i18n="you_play"></legend>
        <div class="seg">
          <label><input type="radio" name="human" value="1"> <b class="x">X</b> – <span data-i18n="goes_first"></span></label>
          <label><input type="radio" name="human" value="2"> <b class="o">O</b> – <span data-i18n="goes_second"></span></label>
        </div>
      </fieldset>

      <fieldset class="ai-only">
        <legend data-i18n="level"></legend>
        <div class="seg">
          <label><input type="radio" name="level" value="1"> <span data-i18n="level_1"></span></label>
          <label><input type="radio" name="level" value="2"> <span data-i18n="level_2"></span></label>
          <label><input type="radio" name="level" value="3"> <span data-i18n="level_3"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="time_limit"></legend>
        <div class="seg">
          <label><input type="radio" name="timeLimit" value="0"> <span data-i18n="time_off"></span></label>
          <label><input type="radio" name="timeLimit" value="10"> <span data-i18n-n="10"></span></label>
          <label><input type="radio" name="timeLimit" value="20"> <span data-i18n-n="20"></span></label>
          <label><input type="radio" name="timeLimit" value="30"> <span data-i18n-n="30"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="allow_undo"></legend>
        <div class="seg">
          <label><input type="radio" name="allowUndo" value="yes"> <span data-i18n="yes"></span></label>
          <label><input type="radio" name="allowUndo" value="no"> <span data-i18n="no"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="sound"></legend>
        <div class="seg">
          <label><input type="radio" name="sound" value="on"> <span data-i18n="on"></span></label>
          <label><input type="radio" name="sound" value="off"> <span data-i18n="off"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="theme"></legend>
        <div class="seg">
          <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
          <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
          <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="language"></legend>
        <select name="lang" class="select" data-i18n-aria="language"></select>
      </fieldset>

      <fieldset>
        <legend data-i18n="controls"></legend>
        <label class="switch"><input type="checkbox" name="confirm"> <span data-i18n="confirm_tap"></span></label>
      </fieldset>

      <details class="rules">
        <summary data-i18n="rules"></summary>
        <ul>
          <li data-i18n-html="rules_1"></li>
          <li data-i18n-html="rules_2"></li>
          <li data-i18n-html="rules_3"></li>
          <li data-i18n-html="rules_4"></li>
          <li data-i18n-html="rules_5"></li>
        </ul>
      </details>

      <div class="dialog-actions">
        <button type="button" id="reset-score" class="ghost" data-i18n="reset_score"></button>
        <button value="ok" class="primary" data-i18n="done"></button>
      </div>

      <p class="privacy-row"><a class="link privacy-link" target="_blank" rel="noopener" data-i18n="privacy"></a></p>
      <p class="credit"><span class="credit-mark" aria-hidden="true">✦</span> Designed by <span class="credit-name">Dawn</span> <span class="credit-mark" aria-hidden="true">✦</span></p>
    </form>
  </dialog>

  <!-- Bảng chọn nhanh khi bấm "Ván mới" -->
  <dialog id="newgame">
    <form class="dlg" id="newgame-form" method="dialog">
      <div class="dlg-head">
        <h2 data-i18n="btn_new" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <fieldset>
        <legend data-i18n="mode"></legend>
        <div class="seg">
          <label><input type="radio" name="mode" value="ai"> <span data-i18n="mode_ai"></span></label>
          <label><input type="radio" name="mode" value="pvp"> <span data-i18n="mode_pvp"></span></label>
        </div>
      </fieldset>
      <fieldset class="ai-only">
        <legend data-i18n="you_play"></legend>
        <div class="seg">
          <label><input type="radio" name="human" value="1"> <b class="x">X</b> <span data-i18n="goes_first"></span></label>
          <label><input type="radio" name="human" value="2"> <b class="o">O</b> <span data-i18n="goes_second"></span></label>
        </div>
      </fieldset>
      <fieldset class="ai-only">
        <legend data-i18n="level"></legend>
        <div class="seg">
          <label><input type="radio" name="level" value="1"> <span data-i18n="level_1"></span></label>
          <label><input type="radio" name="level" value="2"> <span data-i18n="level_2"></span></label>
          <label><input type="radio" name="level" value="3"> <span data-i18n="level_3"></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="time_limit"></legend>
        <div class="seg">
          <label><input type="radio" name="timeLimit" value="0"> <span data-i18n="time_off"></span></label>
          <label><input type="radio" name="timeLimit" value="10"> <span data-i18n-n="10"></span></label>
          <label><input type="radio" name="timeLimit" value="20"> <span data-i18n-n="20"></span></label>
          <label><input type="radio" name="timeLimit" value="30"> <span data-i18n-n="30"></span></label>
        </div>
      </fieldset>
      <button class="primary wide" value="start" data-i18n="start_game"></button>
    </form>
  </dialog>

  <!-- ============================ Online ============================ -->
  <dialog id="online">
    <div class="dlg">
      <div class="dlg-head">
        <h2 data-i18n="online_title" tabindex="-1" autofocus></h2>
        <span class="conn" id="conn"></span>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="dlg-invites" id="dlg-invites" hidden></div>
      <section class="card" id="account"></section>
      <section class="card" id="quick-card">
        <h3 data-i18n="quick_title"></h3>
        <!-- Như Lichess: bấm một ô là tìm trận ngay với thời gian đó -->
        <div class="qm-grid" id="qm-grid" role="group" data-i18n-aria="time_limit">
          <button type="button" class="qm-tile" data-time="10"><b>10</b><small data-i18n="qm_unit"></small></button>
          <button type="button" class="qm-tile" data-time="20"><b>20</b><small data-i18n="qm_unit"></small></button>
          <button type="button" class="qm-tile" data-time="30"><b>30</b><small data-i18n="qm_unit"></small></button>
          <button type="button" class="qm-tile" data-time="0"><b>∞</b><small data-i18n="time_off"></small></button>
          <button type="button" class="qm-tile wide2" data-time="-1" id="qm-start"><b data-i18n="qm_any"></b><small data-i18n="qm_any_sub"></small></button>
        </div>
        <div class="row qm-search" id="qm-search" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span class="qm-status" id="qm-status" role="status"></span>
          <button type="button" class="ghost" id="qm-cancel" data-i18n="cancel"></button>
        </div>
        <p class="hint" data-i18n="qm_hint"></p>
      </section>
      <section class="card" id="tour-card">
        <h3 data-i18n="tours_clubs"></h3>
        <div class="row">
          <button type="button" class="primary" id="open-tours"><svg class="ico i-in" aria-hidden="true"><use href="#i-trophy"/></svg><span data-i18n="tours_title"></span> <i class="count" id="tour-badge" hidden></i></button>
          <button type="button" class="ghost" id="open-clubs"><svg class="ico i-in" aria-hidden="true"><use href="#i-users"/></svg><span data-i18n="clubs_title"></span></button>
        </div>
        <p class="hint" data-i18n="tours_card_hint"></p>
      </section>
      <section class="card">
        <h3 data-i18n="create_room"></h3>
        <div class="seg">
          <label><input type="radio" name="room-side" value="first" checked> <span data-i18n="me_first"></span></label>
          <label><input type="radio" name="room-side" value="second"> <span data-i18n="me_second"></span></label>
        </div>
        <div class="seg" role="group" data-i18n-aria="time_limit">
          <label><input type="radio" name="room-time" value="0" checked> <span data-i18n="time_off"></span></label>
          <label><input type="radio" name="room-time" value="10"> <span data-i18n-n="10"></span></label>
          <label><input type="radio" name="room-time" value="20"> <span data-i18n-n="20"></span></label>
          <label><input type="radio" name="room-time" value="30"> <span data-i18n-n="30"></span></label>
        </div>
        <label class="check"><input type="checkbox" id="room-public"> <span data-i18n="room_public"></span></label>
        <div class="row">
          <button type="button" class="primary" id="create-room" data-i18n="create_room"></button>
          <button type="button" class="ghost" id="open-join" data-i18n="join_by_code"></button>
        </div>
        <p class="hint" data-i18n="room_hint"></p>
      </section>
      <section class="card" id="lobby-card">
        <h3 data-i18n="lobby_title"></h3>
        <ul class="people" id="lobby-list"></ul>
      </section>
      <section class="card" id="friends"></section>
    </div>
  </dialog>

  <dialog id="auth">
    <form class="dlg" id="auth-form">
      <div class="dlg-head">
        <div class="tabs">
          <button type="button" data-tab="login" class="on" data-i18n="login"></button>
          <button type="button" data-tab="register" data-i18n="register"></button>
        </div>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <label class="field reg-only"><span data-i18n="display_name"></span><input name="name" maxlength="24" autocomplete="nickname"></label>
      <label class="field"><span data-i18n="username"></span><input name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span data-i18n="password"></span><input name="password" type="password" maxlength="100" autocomplete="current-password" required></label>
      <a href="#" class="link login-only" id="go-forgot" data-i18n="forgot" hidden></a>
      <p class="err" id="auth-err"></p>
      <button class="primary wide" id="auth-submit"></button>
      <div class="google-box" id="google-box" hidden>
        <div class="or" data-i18n="or"></div>
        <div id="google-btn"></div>
      </div>
    </form>
  </dialog>

  <dialog id="join">
    <form class="dlg" id="join-form">
      <div class="dlg-head">
        <h2 data-i18n="join_title"></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="room_code_label"></span><input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" autocomplete="off" required></label>
        <label class="field short"><span data-i18n="password"></span><input name="password" inputmode="numeric" pattern="\d{3}" maxlength="3" placeholder="123" autocomplete="off" required></label>
      </div>
      <p class="err" id="join-err"></p>
      <button class="primary wide" data-i18n="join_title"></button>
    </form>
  </dialog>

  <dialog id="room-info">
    <div class="dlg">
      <div class="dlg-head">
        <h2 id="room-title"></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="codes">
        <div><small data-i18n="room_code_label"></small><b id="ri-code"></b></div>
        <div><small data-i18n="password"></small><b id="ri-pass"></b></div>
      </div>
      <p class="hint" id="ri-time"></p>
      <div class="link-row">
        <input id="ri-link" readonly>
        <button type="button" class="primary" id="ri-copy" data-i18n="copy"></button>
      </div>
      <button type="button" class="ghost wide" id="ri-share" hidden data-i18n="share"></button>
      <button type="button" class="primary wide" id="ri-tour" hidden><svg class="ico i-in" aria-hidden="true"><use href="#i-trophy"/></svg><span data-i18n="tour_view"></span></button>
      <p class="hint" id="ri-hint"></p>
      <ul class="players" id="ri-players"></ul>
      <p class="hint" id="ri-h2h"></p>
    </div>
  </dialog>

  <dialog id="tour-dlg">
    <div class="dlg tour-dlg">
      <div class="dlg-head">
        <button type="button" class="ghost sm icon" id="tour-back" hidden data-i18n-aria="back"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h2 id="tour-title" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="tabs tour-tabs" id="tour-tabs">
        <button type="button" data-ttab="tours" data-i18n="tours_title"></button>
        <button type="button" data-ttab="clubs" data-i18n="clubs_title"></button>
        <button type="button" data-ttab="admin" hidden></button>
      </div>
      <div class="tour-body" id="tour-body"></div>
    </div>
  </dialog>

  <dialog id="challenge">
    <form class="dlg" id="challenge-form">
      <div class="dlg-head">
        <h2 id="ch-title"></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <fieldset>
        <legend data-i18n="format"></legend>
        <div class="seg">
          <label><input type="radio" name="bo" value="1" checked> Bo1</label>
          <label><input type="radio" name="bo" value="3"> Bo3</label>
          <label><input type="radio" name="bo" value="5"> Bo5</label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="first_game"></legend>
        <div class="seg">
          <label><input type="radio" name="first" value="me" checked> <span data-i18n="me_first"></span></label>
          <label><input type="radio" name="first" value="them"> <span data-i18n="them_first"></span></label>
          <label><input type="radio" name="first" value="random"> <span data-i18n="random"></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="time_limit"></legend>
        <div class="seg">
          <label><input type="radio" name="time" value="0" checked> <span data-i18n="time_off"></span></label>
          <label><input type="radio" name="time" value="10"> <span data-i18n-n="10"></span></label>
          <label><input type="radio" name="time" value="20"> <span data-i18n-n="20"></span></label>
          <label><input type="radio" name="time" value="30"> <span data-i18n-n="30"></span></label>
        </div>
      </fieldset>
      <p class="hint" data-i18n="challenge_hint"></p>
      <button class="primary wide" data-i18n="send_challenge"></button>
    </form>
  </dialog>

  <dialog id="history">
    <div class="dlg">
      <div class="dlg-head">
        <h2 data-i18n="history_title" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <ul class="games" id="history-list"></ul>
    </div>
  </dialog>

  <dialog id="leaderboard">
    <div class="dlg">
      <div class="dlg-head">
        <h2 data-i18n="lb_title" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <p class="hint" id="lb-me"></p>
      <ol class="ranks" id="lb-list"></ol>
      <p class="hint" data-i18n="lb_hint"></p>
    </div>
  </dialog>

  <dialog id="chat">
    <div class="dlg chat-dlg">
      <div class="dlg-head">
        <div class="pn"><b id="chat-name"></b><small id="chat-sub"></small></div>
        <button type="button" class="ghost sm" id="chat-report" data-i18n="report"></button>
        <button type="button" class="ghost sm" id="chat-block" data-i18n="block"></button>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="msgs" id="chat-msgs"></div>
      <form class="row" id="chat-form">
        <input name="text" maxlength="500" autocomplete="off" data-i18n-ph="chat_ph" required>
        <button class="primary" data-i18n="send"></button>
      </form>
    </div>
  </dialog>

  <dialog id="report">
    <form class="dlg" id="report-form">
      <div class="dlg-head">
        <h2 id="report-title" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <div class="seg col">
        <label><input type="radio" name="reason" value="spam" checked> <span data-i18n="reason_spam"></span></label>
        <label><input type="radio" name="reason" value="abuse"> <span data-i18n="reason_abuse"></span></label>
        <label><input type="radio" name="reason" value="cheat"> <span data-i18n="reason_cheat"></span></label>
        <label><input type="radio" name="reason" value="other"> <span data-i18n="reason_other"></span></label>
      </div>
      <p class="hint" data-i18n="report_hint"></p>
      <button class="primary wide" data-i18n="send_report"></button>
    </form>
  </dialog>

  <dialog id="account-dlg">
    <div class="dlg">
      <div class="dlg-head">
        <h2 data-i18n="account_settings" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <form class="card" id="pw-form">
        <h3 id="pw-title"></h3>
        <p class="hint" id="pw-hint"></p>
        <label class="field" id="pw-current"><span data-i18n="current_password"></span><input name="current" type="password" maxlength="100" autocomplete="current-password"></label>
        <label class="field"><span data-i18n="new_password"></span><input name="next" type="password" minlength="6" maxlength="100" autocomplete="new-password" required></label>
        <label class="field"><span data-i18n="confirm_password"></span><input name="again" type="password" minlength="6" maxlength="100" autocomplete="new-password" required></label>
        <p class="err" id="pw-err"></p>
        <button class="primary" data-i18n="save"></button>
      </form>
      <form class="card" id="email-form">
        <h3 data-i18n="email"></h3>
        <p class="hint" data-i18n="email_hint"></p>
        <p class="email-status" id="email-status"></p>
        <label class="field"><span data-i18n="email"></span><input name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com"></label>
        <label class="field" id="email-pw"><span data-i18n="current_password"></span><input name="password" type="password" maxlength="100" autocomplete="current-password"></label>
        <button class="primary" data-i18n="save"></button>
        <div class="step2" id="email-verify" hidden>
          <p class="hint" id="email-verify-hint"></p>
          <div class="row">
            <input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-i18n-ph="reset_code">
            <button type="button" class="primary" id="email-verify-btn" data-i18n="verify"></button>
          </div>
          <a href="#" class="link" id="email-resend" data-i18n="resend"></a>
        </div>
        <p class="err" id="email-err"></p>
      </form>
      <section class="card">
        <h3 data-i18n="blocked_list"></h3>
        <ul class="people" id="blocked-list"></ul>
      </section>
      <form class="card danger" id="delete-form">
        <h3 data-i18n="delete_account"></h3>
        <p class="hint" data-i18n="delete_hint"></p>
        <label class="field"><span id="delete-label"></span><input name="secret" maxlength="100" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
        <p class="err" id="delete-err"></p>
        <button class="danger-btn" data-i18n="delete_btn"></button>
      </form>
      <a class="link privacy-link" target="_blank" rel="noopener" data-i18n="privacy"></a>
    </div>
  </dialog>

  <dialog id="forgot">
    <form class="dlg" id="forgot-form">
      <div class="dlg-head">
        <h2 data-i18n="forgot_title" tabindex="-1" autofocus></h2>
        <button type="button" class="x-close" data-close data-i18n-aria="close">✕</button>
      </div>
      <label class="field"><span data-i18n="forgot_login"></span><input name="login" maxlength="254" autocapitalize="none" spellcheck="false" autocomplete="username" required></label>
      <p class="hint" id="forgot-hint" data-i18n="forgot_hint"></p>
      <div class="step2" id="forgot-step2" hidden>
        <label class="field"><span data-i18n="reset_code"></span><input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
        <label class="field"><span data-i18n="new_password"></span><input name="password" type="password" minlength="6" maxlength="100" autocomplete="new-password"></label>
      </div>
      <p class="err" id="forgot-err"></p>
      <button class="primary wide" id="forgot-submit"></button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="native.js"></script>
  <script src="i18n.js"></script>
  <script src="sound.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
  <script src="online.js"></script>
  <script src="social.js"></script>
  <script src="match.js"></script>
  <script src="tour-patch.js"></script>
  <script src="tour.js"></script>
  <script src="tour-stages.js"></script>
  <script src="tour-form.js"></script>
  <script src="tour-groups.js"></script>
  <script src="club.js"></script>
</body>
</html>
